# Hardened default for the local workstation. Host-specific overrides are explicit.
[galaxy]
ignore_certs = False

[defaults]
forks = 10
host_key_checking = True
roles_path = ./roles
nocows = 1
gathering = smart
# Avoid jsonfile cache warnings and writing machine facts without a configured path.
fact_caching = memory
fact_caching_timeout = 600
# No automatic logging of tasks or values to repository files.
# Use --vault-id explicitly when secrets are required.
timeout = 30
display_skipped_hosts = False
deprecation_warnings = True

[inventory]
# Accept the standard safe inventory formats.
enable_plugins = host_list, script, yaml, ini, auto

[privilege_escalation]
become_method = sudo

[ssh_connection]
# Verify known_hosts. Never redirect known_hosts to /dev/null.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o ServerAliveInterval=60
pipelining = False
timeout = 10

[paramiko_connection]
record_host_keys = True
