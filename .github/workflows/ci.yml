---
name: CI
"on":
  pull_request:
    types: [ready_for_review, reopened, synchronize]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Offline contracts, Python and YAML lint
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Sync ephemeral CI venv
        run: uv sync --project . --locked --group dev
      - name: Offline contracts
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*contract.py' -v
      - name: Ruff
        run: .venv/bin/ruff check tests
      - name: YAML lint
        run: .venv/bin/yamllint -d relaxed tasks/network_split_dns.yml tasks/runtime_mise_uv.yml

  molecule:
    # Docker-heavy Molecule validation is manual to limit Actions usage.
    if: github.event_name == 'workflow_dispatch'
    name: Molecule manual integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Prepare Molecule environment
        run: uv sync --project . --locked --group dev && uv pip install --python .venv/bin/python 'molecule' 'molecule-plugins[docker]' docker
      - name: Run Molecule
        run: .venv/bin/molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ubuntu2404
          MOLECULE_PLAYBOOK: converge.yml
