---
name: Ansible Syntax
"on":
  pull_request:
    branches: [master]
    types: [ready_for_review, reopened, synchronize]
    paths:
      - "tasks/**"
      - "defaults/**"
      - "playbooks/**"
      - "requirements.yml"
      - "pyproject.toml"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Set up project environment
        run: uv sync --group dev
      - name: Install Ansible collections
        run: |
          uv run --no-sync ansible-galaxy collection install ansible.posix community.general
      - name: Check syntax only
        run: uv run --no-sync ansible-playbook --syntax-check playbooks/workstation.yml
        env:
          ANSIBLE_FORCE_COLOR: "1"
