---
# Shared by apport, Tailscale and cloudflared tasks below.
- name: workstation | Inspect installed services
  ansible.builtin.service_facts:
  when: ansible_os_family == 'Debian'
  tags: [security, vpn, tunnel]

- name: workstation | Install certificates tools
  ansible.builtin.apt:
    name:
      - libnss3-tools # for certutil
      - apt-transport-https
      - ca-certificates
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: package

- name: workstation | Install VNC
  ansible.builtin.apt:
    name: tigervnc-standalone-server
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and vnc_enabled
  tags: package

- name: workstation | Install XRDP
  ansible.builtin.apt:
    name: xrdp
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and xrdp_enabled
  tags: package

# Warning might be in conflict with security profile
- name: workstation | Install stats basic tools
  ansible.builtin.apt:
    name:
      - htop
      - finger
      - sysstat
      - net-tools # for netstat
      - rusers
      - curl
      - wget
      - rsync
      - unar
      - pydf # disk
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and stats_enabled
  tags: package

- name: workstation | Install network security basic tools
  ansible.builtin.apt:
    name:
      - tcpdump
      - dsniff # ARP spoofing
      - arpalert
      - mitmproxy
      - aircrack-ng
      - nikto
      - hydra
      - hydra-gtk
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and stats_enabled
  tags: [package, security, network]

# sudo rkhunter --check --rwo --pkgmgr dpkg ; sudo rkhunter --propupd
- name: workstation | Install security basic tools
  ansible.builtin.apt:
    name:
      - testdisk
      - chkrootkit
      - rkhunter
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and stats_enabled
  tags: [package, security, rootkit]

- name: workstation | Install security antivirus tools
  ansible.builtin.apt:
    name:
      - clamav
      - clamav-daemon
      - clamtk
      - tiger
      - inotify-tools
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and stats_enabled
  tags: package

- name: workstation | Install security encryption tools
  ansible.builtin.apt:
    name:
      - gnupg
      - age
      - gnome-disk-utility
      - cryptsetup
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: [package, encryption, gpg]

- name: workstation | Install security tools
  ansible.builtin.apt:
    name:
      - apt-listchanges
      - needrestart
      - debsecan
      - debsums
      - skopeo
      - lynis # sudo lynis audit system
      - debian-goodies # checkrestart
      - wipe
      - secure-delete
      - gpa
      - seahorse
      - seahorse-nautilus
      - keychain
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: [package, docker, lynis, hdd, wipe, gpg, keychain, vm]

- name: workstation | Disable apport
  ansible.builtin.systemd_service:
    name: apport.service
    state: stopped
    enabled: false
  become: true
  when:
    - ansible_os_family == 'Debian'
    - "'apport.service' in ansible_facts.services"

# The 20auto-upgrades file below enables the periodic run idempotently.
- name: workstation | Install unattended upgrade
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  become: true
  when: ansible_os_family == 'Debian'
  tags: [package, unattended-upgrades, vm]

- name: workstation | Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  become: true
  when: ansible_os_family == 'Debian'
  # Own tag: it overwrites the cadence set in "Software & Updates", unlike the drop-in below.
  tags: [apt-periodic, vm]

# Drop-in instead of overwriting the 50unattended-upgrades package conffile,
# whose default origins already cover the release and -security pockets.
- name: workstation | Configure unattended-upgrades behaviour
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-workstation
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by ansible-workstation
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
  become: true
  when: ansible_os_family == 'Debian'
  tags: [unattended-upgrades, vm]

- name: workstation | Install logwatch and secrets tools
  ansible.builtin.apt:
    name:
      - logwatch
      - libsecret-tools
      - gnome-keyring
      - lastpass-cli # do not install bitwarden via snap
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: [package, logwatch, secrets, lastpass, vm]

- name: workstation | Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'

- name: workstation | Configure fail2ban for SSH protection
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
  become: true
  when: ansible_os_family == 'Debian'
  notify: workstation | Restart fail2ban

- name: workstation | Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  become: true
  when: ansible_os_family == 'Debian'

- name: workstation | Uninstall unsecured applications
  ansible.builtin.apt:
    name:
      - telnetd
      - ftpd
      - vsftpd
    state: absent
    purge: true
  become: true
  when: ansible_os_family == 'Debian'
  tags: package

# Tailscale is retained as an optional legacy VPN, never uninstalled here.
# Explicit management of an existing service can safely disable it without purge.
- name: workstation | Disable existing Tailscale without uninstalling it
  ansible.builtin.systemd_service:
    name: tailscaled.service
    state: stopped
    enabled: false
  become: true
  when:
    - ansible_os_family == 'Debian'
    - workstation_tailscale_disable_existing | bool
    - not (tailscale_enabled | bool)
    - "'tailscaled.service' in ansible_facts.services"
  tags: [security, vpn]

# A legacy Tailscale installation must require explicit opt-in.
# Do not use curl | shell or modify package sources at each workstation run.
- name: workstation | Install Tailscale only when explicitly enabled
  ansible.builtin.apt:
    name: tailscale
    state: present
  become: true
  when:
    - ansible_os_family == 'Debian'
    - tailscale_enabled | bool
    - workstation_tailscale_install_enabled | bool
  tags: [security, vpn]

- name: workstation | Enable a previously installed Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled.service
    state: started
    enabled: true
  become: true
  when:
    - ansible_os_family == 'Debian'
    - tailscale_enabled | bool
    - "'tailscaled.service' in ansible_facts.services"
  tags: [security, vpn]

# Cloudflare Tunnel deployment and tokens are managed outside this role.
# Never create a new connector, log tokens or overwrite tunnel config here.
- name: workstation | Manage existing cloudflared service (opt-in)
  ansible.builtin.systemd_service:
    name: cloudflared.service
    state: started
    enabled: true
  become: true
  when:
    - ansible_os_family == 'Debian'
    - workstation_cloudflared_manage_existing | bool
    - "'cloudflared.service' in ansible_facts.services"
  tags: [security, tunnel]

- name: workstation | Require existing cloudflared unit when management is enabled
  ansible.builtin.assert:
    that:
      - "'cloudflared.service' in ansible_facts.services"
    fail_msg: >-
      cloudflared systemd unit is missing. Provision an authorized tunnel
      with its credentials outside this role; no token is generated here.
  when:
    - ansible_os_family == 'Debian'
    - workstation_cloudflared_manage_existing | bool
  tags: [security, tunnel]

# Firewall management is opt-in: Docker bridge/SSH routes must be audited first.
- name: workstation | Apply approved firewall configuration
  when: workstation_firewall_manage_enabled | bool
  become: true
  tags: [security, firewall]
  block:
    - name: workstation | Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: workstation | Set UFW default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: "incoming", policy: "deny" }
        - { direction: "outgoing", policy: "allow" }
        - { direction: "routed", policy: "deny" }

    - name: workstation | Allow Tailscale UDP port 41641
      community.general.ufw:
        rule: allow
        port: "41641"
        proto: udp
        comment: "Tailscale"
      when: tailscale_enabled | bool

    - name: workstation | Validate default network interface was detected
      ansible.builtin.assert:
        that:
          - ansible_default_ipv4.interface is defined
        fail_msg: "Failed to detect default network interface. Cannot configure firewall rules safely."
        success_msg: "Default network interface detected: {{ ansible_default_ipv4.interface }}"

    - name: workstation | Create UFW after.rules for Docker isolation
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Docker isolation"
        insertbefore: "^COMMIT$"
        block: |
          # Docker port isolation - block all forwarded traffic by default
          :DOCKER-USER - [0:0]

          # Allow established connections
          -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

          # Allow localhost
          -A DOCKER-USER -i lo -j ACCEPT

          # Block all other forwarded traffic to Docker containers from external interface
          -A DOCKER-USER -i {{ ansible_default_ipv4.interface }} -j DROP
        create: false
