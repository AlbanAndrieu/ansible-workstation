---
# System tuning: grub, preload, ureadahead, perl-doc, galternatives.

- name: system_tuning | Install Grub Customizer
  ansible.builtin.apt:
    name: grub-customizer
    state: "{{ util_pkg_state | default('present') }}"
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian' and grub_customizer_enabled
  tags: grub_customizer

- name: system_tuning | Install preload
  ansible.builtin.apt:
    name: preload
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: package

- name: system_tuning | Install ureadahead
  ansible.builtin.apt:
    name: ureadahead
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: package

- name: system_tuning | Install perl-doc
  ansible.builtin.apt:
    name: perl-doc
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: package

- name: system_tuning | Install galternatives
  ansible.builtin.apt:
    name: galternatives
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian'
  tags: package
