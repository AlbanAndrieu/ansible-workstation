---
- name: workstation | Install performance tools
  action: "{{ ansible_pkg_mgr }} name={{ item }} state={{ util_pkg_state | default('present') }}"
  become: true
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and stats_enabled
  tags: package
  with_items:
    #    - jmeter
    - optipng
    - pngtools
    - imagemagick
    # sudo nethogs eth1
    - nethogs
    - ifstat
