---
# SCM: git, gitg, diff tools, myrepos, GitLab CLI.
# Controlled by: scm_enabled.

- name: git | Install SCM packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and scm_enabled
  loop:
    - git
    - gitg
  tags: package

- name: git | Install diff/export tools for git
  ansible.builtin.apt:
    name: "{{ item }}"
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and scm_enabled
  loop:
    - python-excelerator
    - catdoc
    - docx2txt
    - python-pdfminer
    - odt2txt
    - libimage-exiftool-perl
  tags: package

- name: git | Install myrepos
  ansible.builtin.apt:
    name: myrepos
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when:
    - ansible_os_family == 'Debian'
    - scm_enabled | bool
    - ansible_distribution_version not in ['12.04', '14.04']
  tags: package

# Provisioning must not unexpectedly enumerate and register every repository,
# or write configuration as root. Registration is explicitly opt-in.
- name: git | Register myrepos for the current user (explicit opt-in)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      root={{ workstation_myrepos_root | quote }}
      test -d "$root" || exit 0
      command -v mr >/dev/null 2>&1 || exit 0
      while IFS= read -r -d '' git_dir; do
        mr register "$(dirname "$git_dir")"
      done < <(find "$root" -type d -name .git -prune -print0)
    executable: /bin/bash
  become: false
  changed_when: false
  when:
    - ansible_os_family == 'Debian'
    - scm_enabled | bool
    - workstation_myrepos_autoregister_enabled | bool
  tags:
    - git
    - myrepos

- name: brew | Install hub (GitHub CLI)
  homebrew:
    name: hub
    state: present
    update_homebrew: true
  when:
    - ansible_system == 'Darwin'
    - scm_enabled | bool
  become: false

- name: git | Install GitLab CLI (glab)
  ansible.builtin.apt:
    name: glab
    state: "{{ util_pkg_state | default('present') }}"
  become: true
  when: ansible_os_family == 'Debian' and scm_enabled
  tags: package
