# #
# Dash unity lens installation
# http://doc.ubuntu-fr.org/unity-lens
#
- name: dash | Uninstall unity-lens and unity-scope packages
  ansible.builtin.apt: >
    pkg={{ item }}
    state=absent
    purge=yes
    force=yes
  become: true
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and dash_enabled
  tags: dash_setup
  with_items:
    - unity-scope-video-remote
    - unity-scope-musicstores
    - unity-lens-shopping
    - unity-lens-gwibber
    - unity-lens-askubuntu
    - unity-scope-askubuntu
    - unity-lens-friends
    - unity-lens-video
    - unity-lens-music
    - unity-lens-photos

- name: dash | Install unity-lens and unity-scope packages
  action: "{{ ansible_pkg_mgr }} name={{ item }} state={{ util_pkg_state | default('present') }}"
  become: true
  when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and dash_enabled
  tags: dash_setup
  with_items:
    - unity-lens-applications
    - unity-lens-files
    # - unity-lens-wikipedia
    # - unity-lens-radios
    # - unity-lens-vm
    # - unity-lens-github
    - unity-scope-gdrive
    - unity-scope-chromiumbookmarks
    - unity-scope-firefoxbookmarks
    - unity-scope-manpages
    - unity-scope-virtualbox

