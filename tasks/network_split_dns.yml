---
# Manage exactly the active NetworkManager connection. No DNS-over-TLS
# downgrade, VPN resolver replacement, or global resolv.conf writes.
- name: workstation | Validate opt-in split DNS parameters
  ansible.builtin.assert:
    that:
      - workstation_split_dns_interface == 'eno1'
      - workstation_split_dns_resolver == '172.17.0.24'
      - workstation_split_dns_domain == 'int.albandrieu.com'
    fail_msg: "Refusing DNS changes outside the approved workstation LAN contract"
  tags: [dns]

- name: workstation | Read active NetworkManager profile
  ansible.builtin.command:
    argv:
      [
        nmcli,
        -g,
        GENERAL.CONNECTION,
        device,
        show,
        "{{ workstation_split_dns_interface }}",
      ]
  register: workstation_dns_profile
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Refuse missing or disconnected profile
  ansible.builtin.assert:
    that:
      - workstation_dns_profile.stdout | trim | length > 0
      - workstation_dns_profile.stdout | trim != '--'
    fail_msg: "NetworkManager profile not found: no changes applied"
  tags: [dns]

- name: workstation | Read configured profile DNS server
  ansible.builtin.command:
    argv:
      [
        nmcli,
        -g,
        ipv4.dns,
        connection,
        show,
        "{{ workstation_dns_profile.stdout | trim }}",
      ]
  register: workstation_dns_servers
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Read configured DHCP DNS override
  ansible.builtin.command:
    argv:
      [
        nmcli,
        -g,
        ipv4.ignore-auto-dns,
        connection,
        show,
        "{{ workstation_dns_profile.stdout | trim }}",
      ]
  register: workstation_dns_auto
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Read configured search domain
  ansible.builtin.command:
    argv:
      [
        nmcli,
        -g,
        ipv4.dns-search,
        connection,
        show,
        "{{ workstation_dns_profile.stdout | trim }}",
      ]
  register: workstation_dns_search
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Read configured link DNS-over-TLS
  ansible.builtin.command:
    argv:
      [
        nmcli,
        -g,
        connection.dns-over-tls,
        connection,
        show,
        "{{ workstation_dns_profile.stdout | trim }}",
      ]
  register: workstation_dns_tls
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Inspect effective DNS before profile reconciliation
  ansible.builtin.command:
    argv: [resolvectl, dns, "{{ workstation_split_dns_interface }}"]
  register: workstation_dns_effective_before
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Configure the homelab resolver as the sole profile DNS
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ workstation_dns_profile.stdout | trim }}"
      - ipv4.ignore-auto-dns
      - "yes"
      - ipv4.dns
      - "{{ workstation_split_dns_resolver }}"
      # Global resolved.conf.d/99-workstation.conf forces DoT to Cloudflare; Pi-hole has no DoT,
      # so the trusted LAN link must stay plain DNS or *.int stops resolving.
      - connection.dns-over-tls
      - "no"
  become: true
  register: workstation_dns_update
  when: >-
    (workstation_dns_servers.stdout | trim) != workstation_split_dns_resolver
    or (workstation_dns_auto.stdout | trim | lower) not in ['yes', 'true']
    or (workstation_dns_tls.stdout | trim | lower) != 'no'
  tags: [dns]

# Append rather than overwrite DNS-search entries belonging to other services.
- name: workstation | Add route-only private DNS domain
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ workstation_dns_profile.stdout | trim }}"
      - +ipv4.dns-search
      - "~{{ workstation_split_dns_domain }}"
  become: true
  register: workstation_dns_domain_update
  when: ('~' ~ workstation_split_dns_domain) not in workstation_dns_search.stdout
  tags: [dns]

- name: workstation | Reapply active link DNS if profile or runtime drifted
  ansible.builtin.command:
    argv: [nmcli, device, reapply, "{{ workstation_split_dns_interface }}"]
  become: true
  when: >-
    workstation_dns_update is changed
    or workstation_dns_domain_update is changed
    or workstation_split_dns_resolver not in workstation_dns_effective_before.stdout
    or workstation_dns_public_resolvers | select('in', workstation_dns_effective_before.stdout) | list | length > 0
  tags: [dns]

- name: workstation | Read effective link DNS after reconciliation
  ansible.builtin.command:
    argv: [resolvectl, dns, "{{ workstation_split_dns_interface }}"]
  register: workstation_dns_effective
  changed_when: false
  check_mode: false
  tags: [dns]

- name: workstation | Fail if effective resolver is still inconsistent
  ansible.builtin.assert:
    that:
      - workstation_split_dns_resolver in workstation_dns_effective.stdout
      - workstation_dns_public_resolvers | select('in', workstation_dns_effective.stdout) | list | length == 0
    fail_msg: >-
      Effective systemd-resolved link DNS is still overridden.
      Check global resolved.conf, NetworkManager dispatcher, VPN and DHCP.
      Do not disable DNS security or rewrite /etc/resolv.conf blindly.
  when: not ansible_check_mode
  tags: [dns]

# Never install a persistent NTA in normal workstation provisioning.
# Explicit opt-in only after runtime NTA validation in nabla-compose.
- name: workstation | Load approved private DNSSEC negative trust anchor
  ansible.builtin.import_tasks: network_dnssec_nta.yml
  when: >-
    workstation_split_dns_persistent_nta_enabled | bool
    or workstation_split_dns_persistent_nta_remove_enabled | bool
  tags: [dns]

# NetworkManager owns eno1, so a systemd.network file would not persist this
# NTA. Dispatcher applies it per LINK after NM activation/reapply, unlike
# system-wide .negative trust anchor files.
- name: workstation | Load scoped NetworkManager DNSSEC NTA dispatcher
  ansible.builtin.import_tasks: network_dnssec_nta_dispatcher.yml
  when: >-
    workstation_split_dns_nta_dispatcher_enabled | bool
    or workstation_split_dns_nta_dispatcher_remove_enabled | bool
  tags: [dns]
