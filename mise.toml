# Declarative runtimes. Downloads run only on explicit "mise install".
min_version = "2026.7.0"

[tools]
python = "3.12"
node = "24"
uv = "0.13.5"

[settings]
# Avoid automatic tool installation and auto-activation from invalid locks.
auto_install = false
task.run_auto_install = false
python.uv_venv_auto = false

[tasks.init]
description = "Explicit locked bootstrap: sync .venv and install safe Git hooks"
run = "bash scripts/bootstrap-workstation.sh"

[tasks.recover-venv]
description = "Explicitly archive a broken .venv without deleting it"
run = "bash scripts/recover-workstation-venv.sh"

[tasks.lock]
description = "Resolve a verified project and inspect its lockfile"
run = "bash scripts/uv-project.sh lock"

[tasks.sync]
description = "Sync only a verified lock into a project-owned venv"
run = "bash scripts/uv-project.sh sync"

[tasks.check-venv]
description = "Verify the selected Ansible comes from this project's .venv"
run = "bash scripts/uv-project.sh check"

[tasks.hooks-diagnose]
description = "Read-only Git hook / local venv / Git ignore troubleshooting"
run = "bash scripts/diagnose-pre-commit.sh"

[tasks.hooks-repair]
description = "Explicitly repair pre-commit in this worktree's existing venv"
run = "bash scripts/repair-pre-commit.sh"

[tasks.test-offline]
description = "Run offline contracts only with verified project .venv (including PyYAML); no CI or apply"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/python -B -m unittest discover -s tests -p 'test_*contract.py' -v"

[tasks.lint]
description = "Run Ruff in the existing, verified project environment"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ruff check tests"

[tasks.syntax]
description = "Use only project Ansible for syntax checking"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook --syntax-check playbooks/workstation.yml"

[tasks.audit-syntax]
description = "Validate only the local read-only Ubuntu audit playbook syntax"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local --syntax-check playbooks/audit-workstation.yml"

[tasks.audit-workstation]
description = "Explicit read-only Ubuntu audit; no sudo and no persistent snapshot"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/audit-workstation.yml"

[tasks.audit-network-syntax]
description = "Verify the unprivileged network visibility playbook without running it"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local --syntax-check playbooks/audit-workstation-network.yml"

[tasks.audit-network]
description = "Read only packet-filter visibility; no sudo or Docker socket"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/audit-workstation-network.yml"

[tasks.audit-network-privileged]
description = "Explicit optional privileged READ ONLY firewall metadata; user Python stays unprivileged; no automatic authentication"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/python -B scripts/audit-workstation-network-privileged.py --ack-privileged-readonly"

[tasks.audit-listeners-syntax]
description = "Syntax-check the nonprivileged local TCP/UDP listener scope audit"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local --syntax-check playbooks/audit-workstation-listeners.yml"

[tasks.audit-listeners]
description = "Observe anonymous TCP/UDP listener bind scope; no sudo or socket names"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/audit-workstation-listeners.yml"

[tasks.measure-network-local]
description = "Explicit bounded TCP local-loopback measurement from PRIVATE home allowlist (outside Git)"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/python -B scripts/measure-workstation-reachability.py --observer local --allowlist \"$HOME/.config/workstation-audit/targets.json\" --confirm-connect"

[tasks.measure-docker-publishing]
description = "Explicit local Docker daemon metadata read; Docker socket can grant root-equivalent privileges"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/python -B scripts/measure-workstation-docker-publishing.py --ack-docker-socket-read"

[tasks.yubikey-os-syntax]
description = "Validate OS-only YubiKey prerequisite playbook (no package changes)"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local --syntax-check playbooks/yubikey-os-prerequisites.yml"

[tasks.yubikey-os-audit]
description = "Read-only Ubuntu YubiKey package readiness, no sudo/PAM/USB access"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/yubikey-os-prerequisites.yml"

[tasks.audit-openclaw-source-syntax]
description = "Syntax-check only the source-workstation OpenClaw read-only audit playbook"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local --syntax-check playbooks/audit-openclaw-source.yml"

[tasks.audit-openclaw-source]
description = "Audit OpenClaw source on Ubuntu; TrueNAS is destination, not managed here"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/audit-openclaw-source.yml"

[tasks.audit-configuration]
description = "Read-only redacted /etc presence, DNS link and systemd unit status audit; no sudo or apply"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/python -B scripts/audit-workstation-configuration.py --json"

[tasks.capture-etc]
description = "Copy /etc files listed in files/etc-manifest.txt into files/etc with secrets redacted; no sudo"
run = "bash scripts/capture-etc.sh"

[tasks.restore-etc-check]
description = "Check-only: which captured /etc files differ from this host; no sudo, no diff output"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/restore-etc.yml"

[tasks.capture-packages]
description = "Write non-default APT/snap/flatpak selections into files/packages and copy referenced keyrings; no sudo"
run = "bash scripts/capture-packages.sh"

[tasks.restore-packages-check]
description = "Check-only: count missing or unavailable captured packages; no sudo, no install"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/restore-packages.yml"

[tasks.harden-network-check]
description = "Check-only: print the ufw allowlist and service clean-up plan; no sudo, no change"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/harden-network.yml"

[tasks.harden-os-check]
description = "Check mode only: devsec os_hardening with workstation overrides; asks for sudo, changes nothing"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/harden-os.yml -K --diff"

[tasks.agent-skills-check]
description = "Offline Ansible skill precedence, provenance and symlink gate; only project Python, no network or apply"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/python -B -m unittest tests/test_agent_skills_contract.py -v && .venv/bin/python -B scripts/check-agent-skills.py"

[tasks.toolchain-check]
description = "Read-only diagnosis of user mise tools, project runtimes and the OpenClaw user gateway; no install"
run = "bash scripts/repair-user-toolchain.sh check"

[tasks.toolchain-repair]
description = "Explicit user repair: mise install, pinned OpenClaw with npm script allowlist, gateway restart; no sudo"
run = "bash scripts/repair-user-toolchain.sh apply"

# DNS/Wi-Fi diagnostics copied from nabla-compose scripts/workstation (cc3f9ca6).
[tasks.workstation-split-dns-check]
description = "Read-only pfSense DNS UDP/TCP, NetworkManager, resolved and NSS evidence"
run = "python3 scripts/homelab-split-dns.py --check"

[tasks.workstation-split-dns-repair]
description = "Explicit workstation-only split-DNS recovery; fails closed if pfSense UDP DNS is unverified"
run = "python3 scripts/homelab-split-dns.py --apply --acknowledge I_APPROVE_WORKSTATION_SPLIT_DNS_REPAIR"

[tasks.workstation-nss-path]
description = "Read-only, deadline-bounded glibc NSS vs systemd-resolved vs 127.0.0.53 stub comparison"
run = "python3 scripts/diagnose-nss-resolution.py --check --samples 2 --timeout 3"

[tasks.workstation-dnssec-check]
description = "Read-only DNSSEC validation comparison; no settings changed, no sudo"
run = "python3 scripts/diagnose-dnssec-chain.py --check --samples 2 --timeout 4"

[tasks.workstation-dnssec-nta-check]
description = "Read-only per-link DNSSEC NTA and validated private lookup"
run = "python3 scripts/recover-split-dns-nta.py --check"

[tasks.workstation-dnssec-nta-try]
description = "Explicit runtime-only negative trust anchor for the private zone; not persistent"
run = "python3 scripts/recover-split-dns-nta.py --apply --acknowledge I_APPROVE_SCOPED_PRIVATE_DNSSEC_NTA"

[tasks.workstation-dnssec-nta-rollback]
description = "Explicit NTA rollback; refuses if other NTAs would be lost"
run = "python3 scripts/recover-split-dns-nta.py --remove --acknowledge I_APPROVE_SCOPED_PRIVATE_DNSSEC_NTA"

[tasks.workstation-dnssec-dispatcher-check]
description = "Read-only: installed dispatcher, exact eno1 NTA and authenticated public DNS"
run = "python3 scripts/accept-private-nta-dispatcher.py --check"

[tasks.workstation-dnssec-dispatcher-exercise]
description = "Explicit sudo acceptance: clear the private NTA, reapply NetworkManager, wait for the dispatcher"
run = "sudo python3 scripts/accept-private-nta-dispatcher.py --exercise --acknowledge I_APPROVE_NTA_REAPPLY_SMOKE"

[tasks.workstation-wifi-path]
description = "Read-only radio, IPv4 route, public and local DNS separation; no pfSense mutation"
run = "python3 scripts/diagnose-wifi-path.py --check"

[tasks.howdy-cameras-syntax]
description = "Syntax-check the opt-in Howdy / motion camera split playbook"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local --syntax-check playbooks/howdy-cameras.yml"

[tasks.howdy-cameras-audit]
description = "Read-only Howdy/motion camera audit: no sudo, no package change, never PAM"
run = "bash scripts/uv-project.sh check >/dev/null && .venv/bin/ansible-playbook -i localhost, -c local playbooks/howdy-cameras.yml"

[tasks.cleanup-check]
description = "Read-only cleanup preview: disk usage, BleachBit cleaner availability and bleachbit --preview"
run = "bash scripts/workstation-cleanup.sh check"

[tasks.cleanup-apply]
description = "Clean regenerable user caches with BleachBit and files/bleachbit/workstation_dev.xml; no sudo"
run = "bash scripts/workstation-cleanup.sh apply"

[tasks.cleanup-apply-system]
description = "Explicit sudo cleanup: apt caches, disabled snaps, journald size, unused flatpaks"
run = "bash scripts/workstation-cleanup.sh apply-system"
