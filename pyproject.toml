[project]
name = "ansible-workstation"
version = "1.0.0"
description = "Reproducible Ubuntu workstation provisioning with Ansible"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Alban Andrieu" }]
dependencies = [
  "ansible-core>=2.21,<2.22",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "netaddr>=1.3,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "python-multipart>=0.0.20"]
deployment = ["python-keystoneclient>=5", "python-swiftclient>=4", "asyncpg>=0.30", "dateparser>=1"]
encryption = ["cryptography>=43", "aiohttp>=3.10"]
telemetry = ["prometheus-client>=0.20", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
influxdb = ["influxdb-client>=1.40"]
notebook = ["notebook>=7"]

[dependency-groups]
dev = [
  "ansible-lint>=25,<27",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
  "yamllint>=1.35,<2",
]

[tool.uv]
# Ansible role / configuration repository, not an installable Python wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", ".direnv", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
