# Managed by ansible-workstation playbooks/restic-backup.yml
# Seconds since the last successful Restic backup; huge value if none ever succeeded.
UserParameter=restic.last_success_age,f=/var/lib/restic/last-success; if [ -f "$f" ]; then echo $(( $(date +%s) - $(stat -c %Y "$f") )); else echo 999999999; fi
