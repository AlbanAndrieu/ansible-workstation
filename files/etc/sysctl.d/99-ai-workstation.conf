###############################################################################
# AI / DevSecOps Workstation
# Ubuntu 26.04
# Docker • Kubernetes • PostgreSQL • Ollama • LiteLLM
###############################################################################

###############################################################################
# Virtual Memory
###############################################################################

# Prefer RAM over swap
vm.swappiness = 10

# Keep filesystem cache longer
vm.vfs_cache_pressure = 50

# PostgreSQL / Elasticsearch / Ollama
vm.max_map_count = 262144

# Allow memory overcommit (useful for AI workloads)
vm.overcommit_memory = 1

# Writeback tuning
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500

###############################################################################
# Filesystem
###############################################################################

# Maximum number of open files
fs.file-max = 2097152

# VSCode / Cursor / Kubernetes / Docker
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576

###############################################################################
# Networking
###############################################################################

# Accept large connection backlogs
net.core.somaxconn = 4096

# Modern TCP Fast Open
net.ipv4.tcp_fastopen = 3

# Larger ephemeral port range
net.ipv4.ip_local_port_range = 10240 65535

# Connection tracking (Docker / Kubernetes)
net.netfilter.nf_conntrack_max = 262144

###############################################################################
# TCP buffers
###############################################################################

net.core.rmem_max = 33554432
net.core.wmem_max = 33554432

net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

###############################################################################
# Security
###############################################################################

# Protect against PID reuse attacks
kernel.pid_max = 4194304
