# Delta from rsyslog default /etc/rsyslog.conf: per-host files.
# Sorted before 50-default.conf to keep the original order: "& ~" stops further rules.
# No network input since 18/11/2026: pfSense, the only sender, is gone (harden-network.yml).

$template RemoteLogs,"/var/log/%HOSTNAME%/%PROGRAMNAME%.log"
*.* ?RemoteLogs
& ~
