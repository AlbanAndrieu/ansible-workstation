# Delta from rsyslog default /etc/rsyslog.conf: syslog server on 514 with per-host files.
# Sorted before 50-default.conf to keep the original order: "& ~" stops further rules.
module(load="imudp")
input(type="imudp" port="514")
module(load="imtcp")
input(type="imtcp" port="514")
$AllowedSender TCP, 127.0.0.1, 192.168.10.0/24, 172.17.0.0/24, *.albandrieu.com

$template RemoteLogs,"/var/log/%HOSTNAME%/%PROGRAMNAME%.log"
*.* ?RemoteLogs
& ~
