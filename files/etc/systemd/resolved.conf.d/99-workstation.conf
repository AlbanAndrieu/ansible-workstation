# Delta from systemd-resolved default /etc/systemd/resolved.conf.
# Quad9 stopped serving France on 2026-11-24: public names go to Cloudflare over strict DoT.
# The LAN profile "Wired eno1" keeps plain DNS to Pi-hole for ~@@INTERNAL@@
# (connection.dns-over-tls no), see tasks/network_split_dns.yml.
[Resolve]
DNSSEC=yes
DNS=
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
DNSOverTLS=yes
FallbackDNS=
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
# Every name not routed to a more specific link domain (~@@INTERNAL@@ on eno1)
# goes to the global DoT servers only, never in clear to the eno1 default route.
Domains=~.
DNSStubListener=yes
