# Managed by ansible-workstation (playbooks/stabilize-workstation.yml), see docs/gpu-llm-workstation.md.
# ollama's install script rewrites ollama.service on each upgrade: the tuning lives here instead.
[Service]
# install.sh copies the PATH of the shell that ran it.
Environment="PATH=/usr/local/bin:/usr/bin:/bin"
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_MODELS=/data/models/ollama"
Environment="OLLAMA_KEEP_ALIVE=12h"
# RTX 2060 6 GB: at 8k context a 4B model stays 100% on the GPU; 7-8B models spill to the CPU.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="OLLAMA_NUM_PARALLEL=1"
# The chat model and the embedding model fit together: a RAG query no longer reloads one for the other.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Leaves room for the desktop (GNOME, Chrome, Claude) on the same GPU.
Environment="OLLAMA_GPU_OVERHEAD=536870912"
# Root-only (0600). OLLAMA_API_KEY goes here, out of the world-readable unit.
EnvironmentFile=-/etc/ollama/ollama.env
