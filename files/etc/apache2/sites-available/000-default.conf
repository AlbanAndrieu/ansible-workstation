<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName www.albandrieu.com
	ServerAlias nabla.albandrieu.com
	ServerAlias albandrieu.albandrieu.com

	ServerAdmin alban.andrieu@free.fr
	# DocumentRoot /var/www/html
	DocumentRoot /var/www/nabla-site-apache/public/

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined env=!healthcheck

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf
</VirtualHost>

<VirtualHost *:8082>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName www.albandrieu.com
	ServerAlias nabla.albandrieu.com
	ServerAlias albandrieu.albandrieu.com
	# ServerAlias login.albandrieu.com
	ServerAlias account.albandrieu.com
	ServerAlias famp.albandrieu.com
	
  # DirectoryIndex index.php index.html

	ServerAdmin alban.andrieu@free.fr
	
	# Was the whole checkout: .git, terraform.tfvars and info.php were downloadable.
	DocumentRoot /var/www/nabla-site-apache/public/
	# Keeps the former /public/... URLs (Glances links /public/index.html).
	Alias /public/ /var/www/nabla-site-apache/public/

  <Directory /var/www/nabla-site-apache/api/>
	  Options -Indexes +FollowSymLinks
	  AllowOverride None
	  Require all granted
  </Directory>    
  
  # Alias /index.html "/var/www/nabla-site-apache/public/index.html"
  
  # RewriteRule ^/(en|fr)/index.html http://albandrieu.albandrieu.com/$1/public [R=301,L]
  # RewriteRule ^/(en|fr)/index.html http://albandrieu.albandrieu.com/public [R=301,L]

  <Directory /var/www/nabla-site-apache/public/>
	  Options -Indexes +FollowSymLinks
	  AllowOverride None
	  Require all granted
  </Directory>
  
  # pfSense HAProxy sends OPTIONS / and OPTIONS /test.php every 0.5 s: keep them out of the access
  # log, and answer the missing /test.php before PHP logs an error for each one.
  SetEnvIfExpr "%{REQUEST_METHOD} == 'OPTIONS' && -R '172.17.0.1'" healthcheck
  Redirect 404 /test.php

  # For vercel compatibility
  ProxyPass "/api/" "http://albandrieu.albandrieu.com/public/"
  
	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined env=!healthcheck

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf
</VirtualHost>

