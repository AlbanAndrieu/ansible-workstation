# Managed by ansible-workstation (docs/security-workstation.md).
# cloudflared connects from loopback: trust CF-Connecting-IP only from there, so tunnel
# clients keep their real address and never count as local or LAN.
RemoteIPHeader CF-Connecting-IP
RemoteIPInternalProxy 127.0.0.1 ::1

# Security scan reports, from local disk: 8087 serves the LAN without mounting the NFS docroot.
Alias /reports /var/www/reports
<Directory /var/www/reports>
  Options -Indexes -FollowSymLinks
  AllowOverride None
  <RequireAny>
    Require ip @@INTERNAL@@
    # Only Cloudflare Access adds this header; 8082 listens on loopback, so only cloudflared forwards it.
    Require expr "%{CONN_REMOTE_ADDR} -ipmatch '127.0.0.1/32' && -n %{HTTP:Cf-Access-Jwt-Assertion}"
  </RequireAny>
</Directory>

# The former copies on the NFS docroot: LAN only.
<LocationMatch "^/public/reports(/|$)">
  Require ip @@INTERNAL@@
</LocationMatch>

# ExtendedStatus shows URLs and client addresses.
<Location /server-status>
  Require ip 127.0.0.1 ::1 @@INTERNAL@@
</Location>
