# Workstation scope for AIDE (docs/security-workstation.md, 26/11/2026).
# Debian's 99_aide_root selects "/ Full": every user file, container layer and NFS share,
# so the database was never built (aide.db empty since August 2025). Keep system binaries,
# boot and configuration; leave user data, caches, containers and network mounts out.
# Installed as /etc/aide/aide.conf.d/95_aide_workstation by playbooks/security-scans.yml.

# Hash with several workers: /usr alone is about 70 GB.
num_workers=4

# User data and work trees
!/home(/|$)
!/workspace(/|$)
!/data(/|$)
!/root/\.cache(/|$)

# Containers, VMs and snaps (images change with every pull or refresh)
!/docker(/|$)
!/var/lib/docker(/|$)
!/var/lib/containerd(/|$)
!/var/lib/libvirt/images(/|$)
!/var/lib/lxd(/|$)
!/snap(/|$)
!/var/lib/snapd/snaps(/|$)

# Network and removable mounts (TrueNAS NFS under /media and /mnt)
!/media(/|$)
!/mnt(/|$)
!/net(/|$)

# Volatile and virtual trees: rebuilt at every boot or login (first report, 27/11/2026:
# 2 277 lxcfs entries, 5 243 per-user temp files).
!/run(/|$)
!/tmp/user(/|$)
!/var/lib/lxcfs(/|$)

# Application data that changes by design
!/opt/sonatype-work(/|$)
!/var/www(/|$)
!/var/lib/security-reports(/|$)
!/swap\.img$
!/swapfile$
